name: NitFX review

on:
  workflow_call:
    inputs:
      base_url:
        description: OpenAI-compatible API prefix; fx appends /chat/completions
        type: string
        required: true
      model:
        type: string
        required: true
      effort:
        description: Passed to fx --effort when set (e.g. low, medium, high)
        type: string
        default: ""
      prompt_file:
        type: string
        default: .github/nitfx.md
      timeout_minutes:
        description: How long the review job may run; a review that reads every file and confirms findings by running code needs more than a quick pass
        type: number
        default: 30
      setup:
        description: Shell commands run after checkout, before the review, so the reviewer can build and run tests
        type: string
        default: ""
    secrets:
      LLM_API_KEY:
        required: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login == github.repository_owner
        && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/review')
        && github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Acknowledge /review
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ env.PR }}/head

      - name: Set up
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: eval "$SETUP"

      - name: Install fx
        run: |
          curl -fsSL https://fx.sh/setup.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # `/review --model <id> --effort <level> <text>`: flags at the start of
      # the comment, in any order, override this run's model and effort; the
      # text after them is added to the prompt. Only the repo owner reaches
      # this, and each value is checked before any step uses it.
      - name: Read /review flags
        id: flags
        env:
          COMMENT: ${{ github.event.comment.body }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        run: |
          rest="${COMMENT#/review}"
          model="$MODEL" effort="$EFFORT"
          while [[ $rest =~ ^[[:space:]]*--(model|effort)[[:space:]]+([^[:space:]]+)(.*)$ ]]; do
            value="${BASH_REMATCH[2]}" rest="${BASH_REMATCH[3]}"
            case "${BASH_REMATCH[1]}" in
              model) [[ $value =~ ^[A-Za-z0-9][A-Za-z0-9._/:-]*$ ]] || { echo "::error::--model $value is not a model id"; exit 1; }; model="$value" ;;
              effort) [[ $value =~ ^(auto|low|medium|high|xhigh|max)$ ]] || { echo "::error::--effort $value is not auto, low, medium, high, xhigh or max"; exit 1; }; effort="$value" ;;
            esac
          done
          printf '%s\n' "$rest" > "$RUNNER_TEMP/request.md"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "effort=$effort" >> "$GITHUB_OUTPUT"

      - name: Configure endpoint
        env:
          LLM_BASE_URL: ${{ inputs.base_url }}
          LLM_MODEL: ${{ steps.flags.outputs.model }}
        run: |
          mkdir -p ~/.fx
          jq -n --arg url "$LLM_BASE_URL" --arg model "$LLM_MODEL" '{
            provider: "llm",
            providers: { llm: {
              protocol: "openai-chat-completions",
              base_url: $url,
              auth: { type: "bearer", env: "LLM_API_KEY" }
            }},
            models: { llm: $model }
          }' > ~/.fx/settings.json

      # The PR's description and its conversation reach the reviewer, so it sees
      # what the author already fixed or rejected, and its own last review.
      # Comments come only from the repo owner and this bot: the reviewer runs
      # with a shell and the API key, so text anyone else posts never reaches it.
      - name: Build prompt
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            cat "${{ inputs.prompt_file }}"
            cat "$RUNNER_TEMP/request.md"
            echo
            echo "# PR description and conversation"
            echo
            gh pr view "$PR" --json title,body,comments --jq \
              '"## " + .title + "\n\n" + .body + "\n\n" + ([.comments[] | select(.author.login == env.OWNER or .author.login == "github-actions") | "### Comment by " + .author.login + "\n\n" + .body] | join("\n\n"))'
            echo
            echo "# Diff"
            echo
            gh pr diff "$PR"
          } > "$RUNNER_TEMP/prompt.md"

      - name: Review
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EFFORT: ${{ steps.flags.outputs.effort }}
        run: |
          fx ask --json --no-save --full-access ${EFFORT:+--effort "$EFFORT"} \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/review.json"
          jq -r .final_output "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/review.md"
          printf '\n<sub>%s%s</sub>\n' "${{ steps.flags.outputs.model }}" "${EFFORT:+, effort $EFFORT}" >> "$RUNNER_TEMP/review.md"

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "$PR" --body-file "$RUNNER_TEMP/review.md" --edit-last --create-if-none
