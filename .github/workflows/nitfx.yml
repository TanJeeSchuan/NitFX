name: NitFX

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/review.yml
    with:
      base_url: https://api.tanjs.dev/v1
      model: gpt-6.1-sol
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
